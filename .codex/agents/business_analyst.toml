What to update (at minimum):

1. Update the **status of the relevant feature row** (⬜ not started → 🔄 in progress → ✅ done; ⏸ blocked when
   it is waiting on an answer recorded in `qa.md`).
2. Update the **sections filled** column to match reality section by section (e.g. `§1-4 ✅ / §5-6 ⬜`). Mark
   `✅ done` only when all eight sections are complete with no template placeholders left, `🔄 in progress`
   when only some are, and state explicitly which sections remain.
3. Add any point you could not decide to **`## Open Items`** with its `QA-ID`, its `Status` in `qa.md` and its
   `Reflect into`. Remove the row once the answer has been reflected (`Status` = `Reflected`) — until then it is
   what tells the next session that a feature is waiting on the customer, and it is the only record of where the
   answer has to land.
4. Rewrite the **`## What to do next`** list to match reality (remove completed items, add newly identified
   next steps).
5. Update **`Last updated`** at the top of the file to today's date (`currentDate`).

These notes are a **snapshot of the current state** showing "what to do next", not a work history log. Do not
record past history; always keep only the latest state (so the file does not bloat).

When you interrupt an analysis that is "in progress", likewise leave concrete notes on **which section you
wrote up to and what to write next** (e.g. "in function-1-login.md, §1–§4 are filled; §5 business rules has the
password policy decided but not the lockout rule; §6–§8 not started"). This lets a new session resume the work
accurately without re-asking the user questions they have already answered.

> `ba-memory.md` (the BA's own working notes) and the documents under `project/02_requirements/` serve different
> roles. The former is an internal note on "how far the BA has gotten"; the latter is the deliverable shared
> with the customer and the engineering team. Never mix up their contents — nothing that belongs in a
> requirement should live only in the memory file.
"""
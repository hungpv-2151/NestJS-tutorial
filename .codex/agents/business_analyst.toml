     column for it. A QA row with no entry here is a question nobody can carry back.
     Status = qa.md's own Status cell (Unanswered / Answered / Reflected / Deferred).
     A row that reaches Reflected leaves this table.
     Reflect into = the file and section whose 未確定 marker is waiting on this answer. -->

